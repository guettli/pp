name: Publish Image

# Builds the SvelteKit Node server (adapter-node) and pushes it to
# ghcr.io/guettli/pp. The image is deployed by guettli/gitops to the k3s
# cluster on the vps host (https://relaxandplay.de/phoneme-party/).
#
# Tags:
#   v<YYYY.MM.DD.HHMMSS>  commit time in UTC (main only). Sortable, so Renovate
#                         in guettli/gitops opens and auto-merges the bump PR.
#   latest                main only. The next build copies the phrase audio
#                         out of it (see "Restore phrase audio").
#   <commit sha>          traceability only.

on:
  push:
    branches: [main]
  # Pull requests build and smoke-test the image but push nothing.
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    # Lint, typecheck and phrase validation must pass before an image is built:
    # Renovate auto-merges every v… tag into gitops.
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & Push pp image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/guettli/pp
      AUDIO_DIR: static/audio

    steps:
      - uses: actions/checkout@v6

      - name: Version tag
        # Only for main: gitops auto-deploys the highest v… tag, so a
        # workflow_dispatch on a feature branch must not mint one. Commit time,
        # not run time: re-running a commit re-pushes the same tag.
        if: github.ref == 'refs/heads/main'
        run: |
          version="v$(TZ=UTC git show -s --format=%cd --date=format-local:%Y.%m.%d.%H%M%S HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "$version"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install ffmpeg
        # generate_edge_tts_audio.py converts edge-tts mp3 to opus.
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Python dependencies
        run: uv sync --frozen

      - name: Build kaldi-fbank WASM
        working-directory: wasm/kaldi-fbank
        run: zig build -Drelease=true

      - name: Generate PanPhon data and phrase JSON
        run: |
          mkdir -p build/data
          uv run python scripts/export_panphon_features.py
          uv run python scripts/generate-phrase-json.py

      - name: Restore phrase audio from the previous image
        # The opus files are generated by edge-tts (about one file per second)
        # and are not in git. Each build starts from the audio of the last
        # published image, so edge-tts only runs for new phrases.
        run: |
          mkdir -p "$(dirname "$AUDIO_DIR")"
          if docker pull -q "$IMAGE:latest"; then
            id=$(docker create "$IMAGE:latest")
            docker cp "$id:/app/build-server/client/phoneme-party/audio" "$AUDIO_DIR"
            docker rm "$id"
            echo "restored $(find "$AUDIO_DIR" -name '*.opus' | wc -l) opus files"
          else
            echo "no previous image -- audio is seeded from the live site below"
          fi

      - name: Generate missing phrase audio
        # --seed-url only matters when the restore above found nothing (first
        # build, or the latest tag was deleted): it fetches the files from the
        # running site instead of generating thousands with edge-tts.
        run: |
          uv run python scripts/generate_edge_tts_audio.py delete-orphans
          uv run python scripts/generate_edge_tts_audio.py create \
            --seed-url https://relaxandplay.de/phoneme-party/audio
          uv run python scripts/generate_edge_tts_audio.py check | tee /tmp/audio-check.txt
          if grep -q "^MISSING" /tmp/audio-check.txt; then
            echo "phrase audio incomplete" >&2
            exit 1
          fi

      - name: Install JS dependencies
        run: pnpm install

      - name: Build server bundle
        run: BUILD_SERVER=1 pnpm build

      - name: Smoke test the server bundle
        # Same entry point as the image. Fails the build before anything is
        # pushed if the bundle does not serve the app, its audio or the API.
        # Run a copy outside the repository: inside it, node would resolve
        # packages from node_modules/, which the image does not have.
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/data"
          cp -r build-server "$RUNNER_TEMP/smoke/"
          echo '{"type":"module"}' > "$RUNNER_TEMP/smoke/build-server/package.json"
          cd "$RUNNER_TEMP/smoke/data"
          PORT=3000 HOST=127.0.0.1 node ../build-server/index.js > /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/phoneme-party/ && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/phoneme-party/ | grep -q "<title>"
          curl -sf http://127.0.0.1:3000/phoneme-party/api/version
          curl -sf -o /dev/null http://127.0.0.1:3000/phoneme-party/coi-serviceworker.js
          curl -sf -o /dev/null http://127.0.0.1:3000/phoneme-party/phrases/de-DE.json
          curl -sf -o /dev/null http://127.0.0.1:3000/phoneme-party/audio/de-DE/edge-tts-male/The_rabbit_laughs.opus
          kill %1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run:
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build & push image
        # linux/amd64 only: the pod runs on the amd64 vps node, and a single
        # manifest (no attestations) keeps the registry mirror's sync trivial.
        run: |
          docker build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            ${VERSION:+-t "$IMAGE:$VERSION"} \
            ${VERSION:+-t "$IMAGE:latest"} \
            .
          # Run the image as the Deployment does (ORIGIN set, /data writable)
          # before anything is pushed.
          docker run -d --name pp-smoke -p 3000:3000 -e ORIGIN=http://127.0.0.1:3000 "$IMAGE:$GITHUB_SHA"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3000/phoneme-party/ && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:3000/phoneme-party/audio/en-GB/edge-tts-female/The_rabbit_laughs.opus
          curl -sf -H "Origin: http://127.0.0.1:3000" -F text=ci-smoke -F phrase=x -F uiLang=en-GB -F studyLang=en-GB \
            http://127.0.0.1:3000/phoneme-party/api/feedback
          docker exec pp-smoke ls /data/feedback
          docker rm -f pp-smoke
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "pull request: image built and tested, not pushed"
            exit 0
          fi
          docker push "$IMAGE:$GITHUB_SHA"
          if [ -n "${VERSION:-}" ]; then
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"
          fi
