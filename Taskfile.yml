version: "3"

tasks:
  default:
    desc: Build everything (WASM, PanPhon data, TypeScript)
    deps: [ts]

  _nix-check:
    internal: true
    run: once
    preconditions:
      - sh: test "${DIRENV_DIR#-}" = "{{.TASKFILE_DIR}}"
        msg: "Not in nix dev shell. Run via: ./run task"

  wasm:
    desc: Build kaldi-fbank WASM via Zig
    deps: [_nix-check]
    dir: wasm/kaldi-fbank
    cmds:
      - zig build -Drelease=true
    sources:
      - fbank-standalone.zig
      - build.zig
      - build.zig.zon
    generates:
      - build/kaldi-fbank.wasm

  panphon:
    desc: Generate PanPhon feature data into build/data/
    deps: [_nix-check]
    cmds:
      - mkdir -p build/data
      - python scripts/export_panphon_features.py
    sources:
      - scripts/export_panphon_features.py
    generates:
      - build/data/panphon_features.json

  ts:
    desc: Build TypeScript (depends on panphon data and WASM)
    deps: [_nix-check, panphon, wasm]
    cmds:
      - pnpm build

  build-server:
    desc: Build server bundle with adapter-node (output in build-server/)
    deps: [_nix-check, panphon, wasm]
    cmds:
      - BUILD_SERVER=1 pnpm build

  node:
    desc: Compile TypeScript for Node.js into build/node/
    deps: [_nix-check]
    cmds:
      - tsc -p tsconfig.build.json
    sources:
      - src/**/*.ts
      - tsconfig.build.json
    generates:
      - build/node/src/**/*.js

  lint:
    desc: Format and lint
    deps: [_nix-check]
    cmds:
      - ./scripts/lint.sh

  typecheck:
    desc: TypeScript type check
    deps: [_nix-check]
    cmds:
      - pnpm typecheck

  test:
    desc: Run e2e tests (requires built dist/)
    deps: [_nix-check, ts]
    cmds:
      - pnpm test

  unit-test:
    desc: Run Node.js unit tests (similarity, phoneme logic)
    deps: [_nix-check, node]
    cmds:
      - node tests/similarity.test.js
      - node tests/phrase-selector.test.js
      - node tests/i18n-completeness.test.js
      - node tests/ipa-validity.test.js
      - node tests/phrase-coverage.test.js
      - node tests/phrase-audio-coverage.test.js

  check:
    desc: Run all checks (lint + typecheck + e2e + unit tests), concurrent where possible
    deps: [lint, typecheck, test, unit-test]
    cmds:
      - ./scripts/validate-phrases-en-GB.py
      - python scripts/apply-blacklist.py

  check-prod:
    desc: Run smoke tests against the live production site
    deps: [_nix-check]
    cmds:
      - pnpm playwright test --project=prod

  apply-blacklist:
    desc: 'Flag blacklisted phrases with "blacklisted: true" using word-boundary regex'
    cmds:
      - python scripts/apply-blacklist.py {{.CLI_ARGS}}

  docs:
    desc: Generate SCRIPTS.md from --help output of all scripts in scripts/
    deps: [_nix-check]
    cmds:
      - bash scripts/generate-scripts-md.sh
    sources:
      - scripts/*.ts
      - scripts/*.py
      - scripts/*.sh
    generates:
      - SCRIPTS.md

  deploy:
    desc: Build, check, deploy to server, and verify prod is up
    deps: [check, docs]
    cmds:
      - rsync -az --delete --exclude='onnx' --exclude='*.debug.yaml' --stats dist/
        tg:public_html/phoneme-party/
      - task: check-prod
