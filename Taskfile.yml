version: "3"

tasks:
  default:
    desc: Build everything (WASM, PanPhon data, TypeScript)
    deps: [ts]

  _nix-check:
    internal: true
    run: once
    preconditions:
      - sh: test "${DIRENV_DIR#-}" = "{{.TASKFILE_DIR}}"
        msg: "Not in nix dev shell. Run via: ./run task"

  wasm:
    desc: Build kaldi-fbank WASM via Zig
    deps: [_nix-check]
    dir: wasm/kaldi-fbank
    cmds:
      - zig build -Drelease=true
    sources:
      - fbank-standalone.zig
      - build.zig
      - build.zig.zon
    generates:
      - build/kaldi-fbank.wasm

  panphon:
    desc: Generate PanPhon feature data into build/data/
    deps: [_nix-check]
    cmds:
      - mkdir -p build/data
      - python scripts/export_panphon_features.py
    sources:
      - scripts/export_panphon_features.py
    generates:
      - build/data/panphon_features.json

  phrases-json:
    desc: Generate static/phrases/{lang}.json from phrases-{lang}.yaml
    cmds:
      - python scripts/generate-phrase-json.py
    sources:
      - phrases-*.yaml
      - scripts/generate-phrase-json.py
    generates:
      - static/phrases/de-DE.json
      - static/phrases/en-GB.json
      - static/phrases/fr-FR.json
      - static/phrases/it-IT.json
      - static/phrases/es-ES.json

  ts:
    desc: Build TypeScript (depends on panphon data and WASM)
    deps: [_nix-check, panphon, wasm, phrases-json]
    sources:
      - src/**/*
      - static/**/*
      - svelte.config.js
      - vite.config.js
      - tsconfig.json
      - package.json
      - pnpm-lock.yaml
      - build/data/panphon_features.json
      - wasm/kaldi-fbank/build/kaldi-fbank.wasm
    generates:
      - dist/index.html
    cmds:
      - |
        START=$(date +%s)
        pnpm build > /tmp/pp-build.log 2>&1 || { cat /tmp/pp-build.log; exit 1; }
        END=$(date +%s)
        echo "build: $((END - START))s"

  build-server:
    desc: Build server bundle with adapter-node (output in build-server/)
    deps: [_nix-check, panphon, wasm, phrases-json]
    cmds:
      - BUILD_SERVER=1 pnpm build

  node:
    desc: Compile TypeScript for Node.js into build/node/
    deps: [_nix-check]
    cmds:
      - tsc -p tsconfig.build.json
    sources:
      - src/**/*.ts
      - tsconfig.build.json
    generates:
      - build/node/src/**/*.js

  lint:
    desc: Format and lint
    deps: [_nix-check]
    cmds:
      - |
        START=$(date +%s)
        ./scripts/lint.sh
        END=$(date +%s)
        echo "lint: $((END - START))s"

  typecheck:
    desc: TypeScript type check
    deps: [_nix-check]
    cmds:
      - |
        START=$(date +%s)
        pnpm typecheck
        END=$(date +%s)
        echo "typecheck: $((END - START))s"

  cache-cdn-assets:
    desc: Download external CDN assets (fastenhancer ONNX model) into ~/.cache/phoneme-party/cdn/
    deps: [_nix-check]
    cmds:
      - ./scripts/download-cdn-assets.sh
    status:
      - test -f "${XDG_CACHE_HOME:-$HOME/.cache}/phoneme-party/cdn/fastenhancer_b.onnx"

  test:
    desc: Run e2e tests (requires built dist/)
    deps: [_nix-check, ts, cache-cdn-assets]
    cmds:
      # Kill any stale preview server so Playwright starts a fresh one each run.
      # Prevents 404s caused by the preview server caching state from a previous build.
      - pkill -f "vite.*8080" || true
      - |
        START=$(date +%s)
        pnpm test
        END=$(date +%s)
        echo "e2e tests: $((END - START))s"
      - node scripts/show-slowest-tests.js
      - |
        echo "Hint: playwright-results.json created. View with: pnpm playwright show-report"

  unit-test:
    desc: Run Node.js unit tests (similarity, phoneme logic)
    deps: [_nix-check, node]
    cmds:
      - |
        START=$(date +%s)
        node tests/similarity.test.js
        node tests/phrase-selector.test.js
        node tests/i18n-completeness.test.js
        node tests/ipa-validity.test.js
        node tests/phrase-coverage.test.js
        node tests/phrase-audio-coverage.test.js
        node tests/i18n-dead-keys.test.js
        END=$(date +%s)
        echo "unit-tests: $((END - START))s"

  check:
    desc: Run all checks (lint + typecheck + e2e + unit tests), concurrent where possible
    deps: [lint, typecheck, test, unit-test]
    cmds:
      - ./scripts/validate-phrases-en-GB.py
      - python scripts/apply-blacklist.py

  test-webkit:
    desc: Run e2e tests on WebKit (Safari engine) — manual use only
    deps: [_nix-check, ts, cache-cdn-assets]
    cmds:
      - pkill -f "vite.*8080" || true
      - pnpm playwright test --project=webkit

  check-prod:
    desc: Run smoke tests against the live production site
    deps: [_nix-check]
    cmds:
      - pnpm playwright test --project=prod

  apply-blacklist:
    desc: 'Flag blacklisted phrases with "blacklisted: true" using word-boundary regex'
    cmds:
      - python scripts/apply-blacklist.py {{.CLI_ARGS}}

  docs:
    desc: Generate SCRIPTS.md from --help output of all scripts in scripts/
    deps: [_nix-check]
    cmds:
      - bash scripts/generate-scripts-md.sh
    sources:
      - scripts/*.ts
      - scripts/*.py
      - scripts/*.sh
    generates:
      - SCRIPTS.md

  deploy:
    desc: Run all checks. Deployment itself happens via GitOps after a push to main (see README)
    deps: [check, docs]
    cmds:
      - |
        echo "Checks passed. To deploy: push to main."
        echo "  .github/workflows/publish-image.yml builds and pushes ghcr.io/guettli/pp:v<date>,"
        echo "  Renovate in guettli/gitops bumps the tag, Flux rolls it out to the vps k3s cluster."
        echo "  Afterwards verify with: ./run task check-prod"
