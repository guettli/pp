# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "local"
hooks = [
  {
    id = "uv-lock-check",
    name = "uv.lock is up to date",
    entry = "uv sync --frozen --check",
    language = "system",
    pass_filenames = false,
    always_run = true
  }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"]
  },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

# Block commits that contain secrets. betterleaks is pinned in mise.toml.
[[repos]]
repo = "local"
hooks = [
  {
    id = "betterleaks",
    name = "betterleaks (secrets)",
    entry = "mise exec betterleaks -- betterleaks git --pre-commit --staged --redact --verbose",
    language = "system",
    pass_filenames = false
  }
]
